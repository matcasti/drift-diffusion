name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo una publicación a la vez; si llega otra, cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.29

      # R solo hace falta cuando una entrada cambia: el resto se recompone
      # desde _freeze/ sin ejecutar código.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      # Latin Modern para que las figuras nuevas usen la misma tipografía
      - name: Instalar Latin Modern
        run: sudo apt-get update && sudo apt-get install -y fonts-lmodern

      - name: Renderizar
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
