<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- Relieve de papel: ruido fino iluminado de lado, en grises -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.4">
      <feDistantLight azimuth="50" elevation="68"/>
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" filter="url(#p)"/>
</svg>
